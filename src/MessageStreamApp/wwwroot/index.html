<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Message Stream Sample</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body { font-family: Arial, sans-serif; margin: 1rem; }
        #messages { border: 1px solid #ccc; padding: 0.5rem; min-height: 200px; max-height: 400px; overflow-y: auto; }
        .message { padding: 0.25rem 0; border-bottom: 1px solid #f0f0f0; }
        .message:last-child { border-bottom: none; }
        .meta { color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>Message Stream Sample</h1>
    <div id="config-display">Loading configuration...</div>
    <h2>Messages</h2>
    <div id="messages"></div>
    <script src="app.js"></script>
</body>
</html>
